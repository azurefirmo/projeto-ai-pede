<ion-header>
  <ion-toolbar>
    <ion-title>BakeryDetail</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>

  <ion-text color="danger" *ngIf="errorMessage">
    <p>{{errorMessage}}</p>
  </ion-text>

  <ion-text color="medium" *ngIf="!isLoading && !errorMessage && listBakery.length === 0">
    <p>Nenhum produto encontrado.</p>
  </ion-text>

  <ion-list>
    <ion-item *ngFor="let bakery of listBakery;">
      <ion-label>{{bakery.id}} - {{bakery.product}}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
